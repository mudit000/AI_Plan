<rect x="540" y="40" width="90" height="42" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="585" y="66" font-size="12" fill="#222222" text-anchor="middle">Deploy</text>
</g>

<line x1="85" y1="82" x2="85" y2="145" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="210" y1="82" x2="210" y2="145" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3,3"/>
