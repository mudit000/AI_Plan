<rect x="290" y="40" width="90" height="42" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="335" y="66" font-size="12" fill="#222222" text-anchor="middle">Test</text>
</g>
