<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="680" height="300" fill="#ffffff"/>

<text x="40" y="26" font-size="13" fill="#555555">1. Raw text</text>
<rect x="40" y="36" width="600" height="36" rx="6" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="340" y="58" font-size="13" fill="#222222" text-anchor="middle">"restarting nginx"</text>

<line x1="340" y1="72" x2="340" y2="96" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow1)"/>
<text x="40" y="112" font-size="12" fill="#555555">2. Sub-word tokens (BPE splits unfamiliar/compound words)</text>

<rect x="40" y="122" width="110" height="34" rx="6" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="95" y="144" font-size="12" fill="#0B4A41" text-anchor="middle">restart</text>
<rect x="160" y="122" width="70" height="34" rx="6" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="195" y="144" font-size="12" fill="#0B4A41" text-anchor="middle">ing</text>
<rect x="240" y="122" width="70" height="34" rx="6" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="275" y="144" font-size="12" fill="#0B4A41" text-anchor="middle">ngi</text>
<rect x="320" y="122" width="70" height="34" rx="6" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="355" y="144" font-size="12" fill="#0B4A41" text-anchor="middle">nx</text>

<line x1="95" y1="156" x2="95" y2="178" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow1)"/>
<line x1="195" y1="156" x2="195" y2="178" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow1)"/>
<line x1="275" y1="156" x2="275" y2="178" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow1)"/>
<line x1="355" y1="156" x2="355" y2="178" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow1)"/>

<text x="40" y="194" font-size="12" fill="#555555">3. Token IDs (integers, vocabulary lookup)</text>
<rect x="40" y="200" width="70" height="30" rx="6" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="75" y="219" font-size="12" fill="#7A2E1F" text-anchor="middle">15390</text>
<rect x="160" y="200" width="70" height="30" rx="6" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="195" y="219" font-size="12" fill="#7A2E1F" text-anchor="middle">278</text>
<rect x="240" y="200" width="70" height="30" rx="6" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="275" y="219" font-size="12" fill="#7A2E1F" text-anchor="middle">4954</text>
<rect x="320" y="200" width="70" height="30" rx="6" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="355" y="219" font-size="12" fill="#7A2E1F" text-anchor="middle">87</text>

<line x1="220" y1="230" x2="220" y2="250" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow1)"/>
<text x="40" y="266" font-size="12" fill="#555555">4. Embedding: the whole sentence -&gt; one vector of 384 floats</text>
<rect x="40" y="272" width="500" height="20" rx="4" fill="#EEE8F7" stroke="#6E4FA3" stroke-width="0.75"/>
<text x="48" y="286" font-size="10" fill="#3E2A63" text-anchor="start">[0.021, -0.184, 0.093, 0.271, ... 380 more numbers]</text>

<defs>
<marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
