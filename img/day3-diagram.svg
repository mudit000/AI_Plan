<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="680" height="400" fill="#ffffff"/>

<text x="40" y="26" font-size="13" fill="#555555">Input tokens</text>
<rect x="40" y="34" width="70" height="34" rx="6" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="75" y="55" font-size="12" fill="#222222" text-anchor="middle">nginx</text>
<rect x="120" y="34" width="70" height="34" rx="6" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="155" y="55" font-size="12" fill="#222222" text-anchor="middle">pod</text>
<rect x="200" y="34" width="90" height="34" rx="6" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="245" y="55" font-size="12" fill="#222222" text-anchor="middle">restarted</text>

<line x1="165" y1="68" x2="165" y2="94" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="40" y="110" font-size="12" fill="#555555">Each token projects into 3 vectors</text>

<rect x="40" y="118" width="80" height="30" rx="6" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="80" y="137" font-size="12" fill="#7A2E1F" text-anchor="middle">Query</text>
<rect x="130" y="118" width="80" height="30" rx="6" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="170" y="137" font-size="12" fill="#0B4A41" text-anchor="middle">Key</text>
<rect x="220" y="118" width="80" height="30" rx="6" fill="#EEE8F7" stroke="#6E4FA3" stroke-width="0.75"/>
<text x="260" y="137" font-size="12" fill="#3E2A63" text-anchor="middle">Value</text>

<text x="360" y="110" font-size="12" fill="#666666" font-style="italic">"which other tokens are relevant to me?"</text>

<line x1="170" y1="148" x2="230" y2="188" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="40" y="190" font-size="12" fill="#555555">Query x Key -&gt; attention score matrix</text>

<g transform="translate(40,200)">
<text x="-8" y="20" font-size="11" fill="#555555" text-anchor="end">nginx</text>
<text x="-8" y="55" font-size="11" fill="#555555" text-anchor="end">pod</text>
<text x="-8" y="90" font-size="11" fill="#555555" text-anchor="end">restarted</text>
<rect x="0" y="0" width="66" height="35" fill="#3E7FB0" opacity="0.85"/>
<rect x="67" y="0" width="66" height="35" fill="#3E7FB0" opacity="0.25"/>
<rect x="134" y="0" width="66" height="35" fill="#3E7FB0" opacity="0.15"/>
<rect x="0" y="36" width="66" height="35" fill="#3E7FB0" opacity="0.3"/>
<rect x="67" y="36" width="66" height="35" fill="#3E7FB0" opacity="0.85"/>
<rect x="134" y="36" width="66" height="35" fill="#3E7FB0" opacity="0.5"/>
<rect x="0" y="72" width="66" height="35" fill="#3E7FB0" opacity="0.7"/>
<rect x="67" y="72" width="66" height="35" fill="#3E7FB0" opacity="0.6"/>
<rect x="134" y="72" width="66" height="35" fill="#3E7FB0" opacity="0.9"/>
<rect x="0" y="0" width="200" height="107" fill="none" stroke="#B0B4B8" stroke-width="0.75"/>
</g>
<text x="40" y="340" font-size="11" fill="#666666">darker cell = "restarted" attends strongly to "nginx" and itself</text>

<line x1="300" y1="260" x2="375" y2="225" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="380" y="200" width="130" height="50" rx="8" fill="#FDECC8" stroke="#BA7517" stroke-width="0.75"/>
<text x="445" y="229" font-size="12" fill="#6B4A0C" text-anchor="middle">Weighted sum</text>
<line x1="510" y1="225" x2="545" y2="225" stroke="#BA7517" stroke-width="1.4" marker-end="url(#arrow2)"/>
<rect x="550" y="200" width="90" height="50" rx="8" fill="#FDECC8" stroke="#BA7517" stroke-width="0.75"/>
<text x="595" y="229" font-size="12" fill="#6B4A0C" text-anchor="middle">Output</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
