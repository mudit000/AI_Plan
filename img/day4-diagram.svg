<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="680" height="300" fill="#ffffff"/>

<text x="40" y="26" font-size="13" fill="#555555">Local serving stack</text>
<rect x="40" y="38" width="90" height="42" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="85" y="63" font-size="12" fill="#222222" text-anchor="middle">curl / app</text>
<line x1="130" y1="59" x2="160" y2="59" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="165" y="38" width="110" height="42" rx="8" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="220" y="63" font-size="12" fill="#0B4A41" text-anchor="middle">Ollama REST API</text>
<line x1="275" y1="59" x2="305" y2="59" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="310" y="38" width="110" height="42" rx="8" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="365" y="63" font-size="12" fill="#0B4A41" text-anchor="middle">llama.cpp engine</text>
<line x1="420" y1="59" x2="450" y2="59" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="455" y="38" width="120" height="42" rx="8" fill="#EEE8F7" stroke="#6E4FA3" stroke-width="0.75"/>
<text x="515" y="63" font-size="12" fill="#3E2A63" text-anchor="middle">GGUF weights (disk)</text>

<line x1="220" y1="80" x2="220" y2="112" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="120" y="115" width="220" height="40" rx="8" fill="#FDECC8" stroke="#BA7517" stroke-width="0.75"/>
<text x="230" y="139" font-size="12" fill="#6B4A0C" text-anchor="middle">Log: latency, tokens/sec, mem</text>

<text x="40" y="196" font-size="13" fill="#555555">Quantization tradeoff (same weights, fewer bits each)</text>
<rect x="40" y="210" width="130" height="40" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="105" y="234" font-size="11" fill="#222222" text-anchor="middle">FP16 - full size</text>
<line x1="170" y1="230" x2="200" y2="230" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="205" y="210" width="150" height="40" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="280" y="234" font-size="11" fill="#222222" text-anchor="middle">Q8_0 - ~half size</text>
<line x1="355" y1="230" x2="385" y2="230" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="390" y="210" width="150" height="40" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="465" y="234" font-size="11" fill="#222222" text-anchor="middle">Q4_K_M - ~quarter size</text>

<text x="40" y="278" font-size="11" fill="#666666">smaller &amp; faster to load/run -&gt;</text>
<text x="390" y="278" font-size="11" fill="#666666">-&gt; small quality loss, usually acceptable</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
