<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="680" height="320" fill="#ffffff"/>

<text x="40" y="24" font-size="13" fill="#555555">Message stack (what gets sent to the model)</text>
<rect x="40" y="34" width="220" height="34" rx="6" fill="#EEE8F7" stroke="#6E4FA3" stroke-width="0.75"/>
<text x="150" y="55" font-size="12" fill="#3E2A63" text-anchor="middle">system: persona + rules</text>
<rect x="40" y="74" width="220" height="34" rx="6" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="150" y="95" font-size="12" fill="#0B4A41" text-anchor="middle">few-shot: example Q&amp;A pairs</text>
<rect x="40" y="114" width="220" height="34" rx="6" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="150" y="135" font-size="12" fill="#7A2E1F" text-anchor="middle">user: the actual question</text>

<line x1="260" y1="91" x2="295" y2="91" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="300" y="68" width="90" height="46" rx="8" fill="#FDECC8" stroke="#BA7517" stroke-width="0.75"/>
<text x="345" y="95" font-size="12" fill="#6B4A0C" text-anchor="middle">Model</text>

<text x="40" y="188" font-size="13" fill="#555555">Temperature controls how peaked the next-token choice is</text>

<text x="100" y="212" font-size="12" fill="#444444" text-anchor="middle">temp = 0.1</text>
<g transform="translate(40,218)">
<rect x="0" y="60" width="24" height="4" fill="#0F7A6B"/>
<rect x="30" y="10" width="24" height="54" fill="#0F7A6B"/>
<rect x="60" y="58" width="24" height="6" fill="#0F7A6B"/>
<rect x="90" y="62" width="24" height="2" fill="#0F7A6B"/>
<rect x="120" y="61" width="24" height="3" fill="#0F7A6B"/>
</g>
<text x="80" y="300" font-size="11" fill="#666666" text-anchor="middle">one token dominates - deterministic</text>

<text x="420" y="212" font-size="12" fill="#444444" text-anchor="middle">temp = 1.2</text>
<g transform="translate(360,218)">
<rect x="0" y="30" width="24" height="34" fill="#C0523E"/>
<rect x="30" y="20" width="24" height="44" fill="#C0523E"/>
<rect x="60" y="35" width="24" height="29" fill="#C0523E"/>
<rect x="90" y="25" width="24" height="39" fill="#C0523E"/>
<rect x="120" y="18" width="24" height="46" fill="#C0523E"/>
</g>
<text x="440" y="300" font-size="11" fill="#666666" text-anchor="middle">probability spreads out - varied, riskier</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
