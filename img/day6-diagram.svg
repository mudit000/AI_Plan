<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="680" height="360" fill="#ffffff"/>

<text x="345" y="24" font-size="12" fill="#666666" text-anchor="middle">Every request is stateless - the API has no memory of past turns on its own</text>

<rect x="30" y="140" width="110" height="46" rx="8" fill="#F1F3F4" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="85" y="166" font-size="12" fill="#222222" text-anchor="middle">User types</text>
<line x1="140" y1="163" x2="175" y2="163" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="180" y="140" width="130" height="46" rx="8" fill="#E4F5F2" stroke="#0F7A6B" stroke-width="0.75"/>
<text x="245" y="166" font-size="12" fill="#0B4A41" text-anchor="middle">Append to history[]</text>
<line x1="310" y1="163" x2="345" y2="163" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="350" y="140" width="140" height="46" rx="8" fill="#FBE9E7" stroke="#C0523E" stroke-width="0.75"/>
<text x="420" y="166" font-size="12" fill="#7A2E1F" text-anchor="middle">Send FULL history</text>
<line x1="490" y1="163" x2="525" y2="163" stroke="#888888" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="530" y="140" width="120" height="46" rx="8" fill="#FDECC8" stroke="#BA7517" stroke-width="0.75"/>
<text x="590" y="166" font-size="12" fill="#6B4A0C" text-anchor="middle">Model streams</text>

<path d="M590 186 L590 230 L245 230 L245 188" fill="none" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="245" y="250" font-size="12" fill="#444444" text-anchor="middle">Append response to history[], loop repeats</text>

<rect x="30" y="270" width="620" height="70" rx="10" fill="none" stroke="#B0B4B8" stroke-width="0.75"/>
<text x="50" y="292" font-size="12" fill="#555555" font-weight="bold">Context window limit</text>
<text x="50" y="312" font-size="11" fill="#555555">History keeps growing every turn - once tokens exceed the model's limit,</text>
<text x="50" y="328" font-size="11" fill="#555555">oldest messages get truncated or summarized before the next send.</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
